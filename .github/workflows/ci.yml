name: CI

# Revisa cada Pull Request y cada cambio en main. Si algún paso falla, el PR muestra
# una ✗ roja y conviene no hacer merge hasta corregirlo.
on:
  pull_request:
  push:
    branches: [main]

# Si llega un commit nuevo al mismo PR, cancela la revisión anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Formato, lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build
